# Avvio locale con Docker: database + backend, senza installare Postgres o Java 25.
#   cp .env.example .env          -> una volta sola, poi si compilano i valori
#   docker compose up --build     -> http://localhost:8080/api/stato
#   docker compose down           -> ferma tutto (i dati restano nel volume)
#   docker compose down -v        -> ferma tutto e cancella il database
#                                    (serve anche per rieseguire schema.sql dopo una modifica)

services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eventi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      # Esposto anche sull'host per collegarsi con DBeaver/pgAdmin.
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Al primo avvio (volume vuoto) Postgres esegue schema.sql: stesse tabelle
      # di pgAdmin e dei test, nessuna copia da tenere allineata (D17).
      - ./back-end/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Il backend parte solo quando Postgres accetta connessioni.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventi"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Backend Spring Boot (stesso Dockerfile usato da Render) ----------
  be:
    build: ./back-end
    # Segreti (SMTP, Cloudinary, OpenRouter) dal file .env, mai nel repository.
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DB_URL gia' in formato JDBC: niente DATABASE_URL, che DatabaseUrl
      # convertirebbe aggiungendo sslmode=require (non supportato dal Postgres locale).
      DB_URL: jdbc:postgresql://db:5432/eventi
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      ALLOWED_ORIGIN: http://localhost:5173,http://localhost:4173
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
