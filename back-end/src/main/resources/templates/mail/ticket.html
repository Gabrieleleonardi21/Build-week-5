<!DOCTYPE html>
<!-- Variabili: firstName, participantName, eventTitle, eventDate, eventPlace, ticketCode, eventId -->
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8">
	<title th:text="${subject}">Il tuo ticket</title>
</head>
<body style="margin:0;background:#f3f4f6;">
<div style="max-width:560px;margin:24px auto;background:#ffffff;border-radius:8px;overflow:hidden;">
	<div th:replace="~{mail/layout :: header}"></div>

	<div style="padding:24px;font-family:Arial,Helvetica,sans-serif;color:#111827;">
		<p>Ciao <strong th:text="${firstName}">Anna</strong>, ecco il tuo ticket.</p>

		<!-- Il "biglietto": i dati sono letti dall'evento al momento dell'invio (D10). -->
		<table style="width:100%;border:2px dashed #9ca3af;border-radius:8px;padding:16px;border-collapse:separate;">
			<tr><td style="color:#6b7280;padding:4px 0;">Evento</td>
				<td style="font-weight:bold;" th:text="${eventTitle}">Concerto al parco</td></tr>
			<tr><td style="color:#6b7280;padding:4px 0;">Data</td>
				<td th:text="${eventDate}">01/06/2027 21:00</td></tr>
			<tr><td style="color:#6b7280;padding:4px 0;">Luogo</td>
				<td th:text="${eventPlace}">Parco Sempione, Milano</td></tr>
			<tr><td style="color:#6b7280;padding:4px 0;">Partecipante</td>
				<td th:text="${participantName}">Anna Rossi</td></tr>
			<tr><td style="color:#6b7280;padding:4px 0;">Codice</td>
				<td style="font-family:monospace;font-size:18px;font-weight:bold;" th:text="${ticketCode}">EVT-7K3M9QA2</td></tr>
		</table>

		<p style="margin-top:24px;">
			<a th:href="${frontendUrl + '/events/' + eventId}"
			   style="background:#2563eb;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none;">
				Vedi l'evento</a>
		</p>
	</div>

	<div th:replace="~{mail/layout :: footer}"></div>
</div>
</body>
</html>
