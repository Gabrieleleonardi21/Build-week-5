<!DOCTYPE html>
<!-- Variabili: ownerName, participantName, eventTitle, eventDate, eventId -->
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8">
	<title th:text="${subject}">Nuova iscrizione</title>
</head>
<body style="margin:0;background:#f3f4f6;">
<div style="max-width:560px;margin:24px auto;background:#ffffff;border-radius:8px;overflow:hidden;">
	<div th:replace="~{mail/layout :: header}"></div>

	<div style="padding:24px;font-family:Arial,Helvetica,sans-serif;color:#111827;">
		<p>Ciao <strong th:text="${ownerName}">Marco</strong>,</p>
		<p><strong th:text="${participantName}">Anna Rossi</strong> si &egrave; iscritto al tuo evento
			<strong th:text="${eventTitle}">Concerto al parco</strong>
			del <span th:text="${eventDate}">01/06/2027 21:00</span>.</p>
		<p>
			<a th:href="${frontendUrl + '/events/' + eventId}"
			   style="background:#2563eb;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none;">
				Vedi i partecipanti</a>
		</p>
	</div>

	<div th:replace="~{mail/layout :: footer}"></div>
</div>
</body>
</html>
