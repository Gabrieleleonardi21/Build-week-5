# Test del backend su ogni PR verso main e su ogni push su main.
# Se la PR unita non compila o un test fallisce, GitHub lo segnala prima del merge
# (es. una PR che usa Role.ADMIN dopo che un'altra l'ha tolto).
# Sui runner GitHub c'e' Docker: girano anche i test con Testcontainers (SchemaValidation*).
name: Backend

on:
  pull_request:
    branches: [main]
    paths: ["back-end/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["back-end/**", ".github/workflows/backend.yml"]

# Una nuova spinta sulla stessa PR annulla il controllo precedente ancora in corso.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Test + report di copertura JaCoCo. Nessun segreto: email, upload e AI non servono ai test.
      - name: Test
        run: ./mvnw -B verify

      # Report consultabile dalla pagina del controllo (Artifacts), anche se i test falliscono.
      - name: Report copertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: back-end/target/site/jacoco/
          if-no-files-found: ignore
