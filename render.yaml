# Blueprint Render: database + backend (derivato da Deploy-Base di Matteo).
# Su Render: New > Blueprint > repository > Apply.
# Dopo il primo deploy: eseguire back-end/src/main/resources/db/schema.sql sul DB
# (psql "<External Database URL>" -f ...), perche' ddl-auto=validate non crea tabelle.
# Il servizio frontend si aggiunge quando esiste la cartella fe/
# (vedi repo-matteo/JavaAIUnit5/HELP/Deploy-Base-*/render.yaml).

databases:
  - name: eventi-db
    databaseName: eventi
    user: eventi
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: eventi-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: back-end
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - back-end/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventi-db
          property: connectionString
      # Origine del FE per il CORS, es. https://eventi-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Indirizzo del FE per i link nelle email (verifica account, ticket), es. https://eventi-fe.onrender.com
      # Senza, i link puntano a http://localhost:5173.
      - key: FRONTEND_URL
        sync: false
      # FE e BE su due sottodomini onrender.com = siti diversi: il cookie di
      # sessione viaggia solo con SameSite=None + Secure.
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Segreti da inserire a mano nella dashboard di Render.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Cartella delle immagini di produzione (in locale il default e' eventi-dev).
      - key: CLOUDINARY_FOLDER
        value: eventi
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      # Primo SUPERADMIN: email di un utente gia' registrato (vedi SuperAdminBootstrap).
      - key: SUPERADMIN_EMAIL
        sync: false
